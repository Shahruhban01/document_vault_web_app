<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Vault</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1><i class="fas fa-cloud"></i> Document Vault</h1>
            <div class="user-menu">
                <span id="username"></span>
                <button class="logout-btn" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </header>
        
        <div class="main-content">
            <aside class="sidebar">
                <button class="upload-btn" onclick="showUploadModal()">
                    <i class="fas fa-plus"></i> Upload File
                </button>
                <button class="create-folder-btn" onclick="showCreateFolderModal()">
                    <i class="fas fa-folder-plus"></i> New Folder
                </button>
                <div class="folder-tree" id="folderTree">
                    <div class="folder-item active" onclick="navigateToFolder(null)">
                        <i class="fas fa-home"></i> Home
                    </div>
                </div>
            </aside>
            
            <main class="file-area">
                <div class="toolbar">
                    <div class="breadcrumb" id="breadcrumb">
                        <span onclick="navigateToFolder(null)">Home</span>
                    </div>
                    <div class="view-options">
                        <button class="view-btn active" onclick="toggleView('grid')" title="Grid View">
                            <i class="fas fa-th"></i>
                        </button>
                        <button class="view-btn" onclick="toggleView('list')" title="List View">
                            <i class="fas fa-list"></i>
                        </button>
                    </div>
                </div>
                <div class="file-grid" id="fileGrid">
                    <div class="loading">
                        <i class="fas fa-spinner fa-spin"></i> Loading...
                    </div>
                </div>
            </main>
        </div>
    </div>
    
    <!-- Upload Modal -->
    <div id="uploadModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Upload Files</h2>
                <span class="close" onclick="closeUploadModal()">&times;</span>
            </div>
            <div class="drop-zone" id="dropZone">
                <i class="fas fa-cloud-upload-alt"></i>
                <p>Drag and drop files here or click to select</p>
                <input type="file" id="fileInput" multiple accept="*/*">
            </div>
            <div class="progress-container" id="progressContainer" style="display: none;">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <span class="progress-text" id="progressText">0%</span>
            </div>
        </div>
    </div>
    
    <!-- Create Folder Modal -->
    <div id="createFolderModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Create New Folder</h2>
                <span class="close" onclick="closeCreateFolderModal()">&times;</span>
            </div>
            <div class="form-group">
                <label for="folderName">Folder Name:</label>
                <input type="text" id="folderName" placeholder="Enter folder name">
            </div>
            <div class="modal-actions">
                <button class="btn-secondary" onclick="closeCreateFolderModal()">Cancel</button>
                <button class="btn-primary" onclick="createFolder()">Create</button>
            </div>
        </div>
    </div>
    
    <!-- Notification Container -->
    <div id="notificationContainer"></div>
    
    <script src="js/app.js"></script>
</body>
</html>
